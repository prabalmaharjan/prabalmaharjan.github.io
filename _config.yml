# ----------------------------------------------------------------------------
# SITE CONFIGURATION
# This file controls global settings for your GitHub Pages site.
# Edit these values, then commit + push — GitHub rebuilds the site automatically.
# ----------------------------------------------------------------------------

title: "Your Name"                     # Shows in the browser tab and site header
description: "Research notes and articles on Programmed DNA Elimination"
                                        # Shows in the site subtitle / meta description

theme: minima                          # Built-in GitHub Pages theme (clean, minimal, free)
                                        # Other built-in options: jekyll-theme-cayman,
                                        # jekyll-theme-minimal, jekyll-theme-slate, etc.

# Optional: add links to the site header (uncomment and edit as needed)
# minima:
#   nav_pages:
#     - about.md

# These help Jekyll build permalinks and RSS feed correctly — leave as is for now
plugins:
  - jekyll-feed
