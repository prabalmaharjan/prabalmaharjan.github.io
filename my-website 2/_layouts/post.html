---
layout: default
---
<article>
  <span class="post-date">{{ page.date | date: "%Y-%m-%d" }}</span>
  <h1 class="headline" style="font-size:34px;">{{ page.title }}</h1>
  <div class="post-body">
    {{ content }}
  </div>
  <a class="back-link" href="{{ '/' | relative_url }}">← Back to all articles</a>
</article>
